[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonoma-ai-runtime"
description = "Phase 0 AI runtime skeleton for Autonoma."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../tests"]
testpaths = ["../tests/ai_runtime"]