services:
  api:
    build:
      context: .
    ports:
      - "${AUTONOMA_API_PORT:-8080}:8080"
    environment:
      AUTONOMA_API_HOST: 0.0.0.0
      AUTONOMA_API_PORT: 8080
      AUTONOMA_DATABASE_URL: postgres://autonoma:autonoma@localhost:5432/autonoma?sslmode=disable
      AUTONOMA_REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.1:8080/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: autonoma
      POSTGRES_USER: autonoma
      POSTGRES_PASSWORD: autonoma
    ports:
      - "${AUTONOMA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U autonoma -d autonoma" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "${AUTONOMA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: